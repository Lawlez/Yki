        ];

        // --- STATE ---

        // --- DOM ELEMENTS ---
        const categoryContainer = document.getElementById('category-container');
        const phraseListContainer = document.getElementById('phrase-list');

        // --- AUDIO ENGINE ---
        let currentAudio = null;

        function speak(text, btnElement) {
            // UI Loading State
            const icon = btnElement.querySelector('i');
            const originalClass = icon.className;
            icon.className = "fas fa-spinner fa-spin text-xl";

            // Clean text (remove brackets and phonetic guide parentheses)
            const cleanText = text.replace(/\[X\]|\[Name\]/g, '').replace(/\([^)]+\)/g, '');

            // Stop any currently playing audio
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            // Use the FREE Google Translate endpoint (No API Key needed!)
            const url = `https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=ja&q=${encodeURIComponent(cleanText)}`;
            currentAudio = new Audio(url);

            // Event listeners to handle the icon animations
            currentAudio.onplay = () => {
                icon.className = "fas fa-volume-up text-xl text-blue-500"; // Playing state
            };

            currentAudio.onended = () => {
                icon.className = originalClass; // Restore original icon
            };

            currentAudio.onerror = () => {
                icon.className = originalClass;
                alert("Could not play audio. Please check your internet connection.");
            };

            // Play the audio
            currentAudio.play().catch(error => {
                console.error("Audio playback failed:", error);
                icon.className = originalClass;
            });
        }

        // --- UI FUNCTIONS ---

        function getFormalityColor(formality) {
            if (formality === 'Formal') return 'bg-blue-100 text-blue-700';
            if (formality === 'Informal') return 'bg-orange-100 text-orange-700';
            return 'bg-slate-100 text-slate-600';
        }

        function setCategory(name) {
            activeCategory = name;
            renderCategories();
            renderPhrases();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                const isActive = activeCategory === cat.name;
                
                // Styling base classes vs active classes
                let className = `flex items-center gap-2 whitespace-nowrap px-4 py-2.5 rounded-full text-sm font-bold transition-all `;
                if (isActive) {
                    className += `bg-red-600 text-white shadow-md transform scale-105`;
                } else {
                    className += `bg-slate-100 text-slate-500 hover:bg-slate-200`;
                }
                
                btn.className = className;
                btn.onclick = () => setCategory(cat.name);
                
                btn.innerHTML = `<i class="fas ${cat.icon} text-[18px]"></i> ${cat.name}`;
                categoryContainer.appendChild(btn);
            });
        }

        function renderPhrases() {
            phraseListContainer.innerHTML = '';
            
            const filteredPhrases = dictionary.filter(item => item.category === activeCategory);
            
            filteredPhrases.forEach(phrase => {
                const formalityClass = getFormalityColor(phrase.formality);
                // We use a safe string replacement for the click handler
                const safeKana = phrase.kana.replace(/'/g, "\\'");

                const cardHTML = `
                    <div class="bg-white border border-slate-100 shadow-sm rounded-2xl p-5 hover:shadow-md transition-shadow relative overflow-hidden group min-h-[120px]">
                        <!-- Formality Tag -->
                        <div class="absolute top-0 right-0 px-3 py-1 rounded-bl-xl text-[10px] font-bold uppercase tracking-wider ${formalityClass}">
                            ${phrase.formality}
                        </div>

                        <!-- Text Content -->
                        <div class="w-full pr-16">
                            <!-- English -->
                            <h3 class="text-lg font-bold text-slate-800 leading-tight mb-2 pr-6">
                                ${phrase.en}
                            </h3>
                            
                            <!-- Romaji -->
                            <p class="text-red-600 font-semibold mb-1 text-sm">
                                ${phrase.romaji}
                            </p>
                            
                            <!-- Kana -->
                            <p class="text-slate-600 text-xl font-medium tracking-wide mt-2">
                                ${phrase.kana}
                            </p>
                        </div>
                        
                        <!-- Audio Button -->
                        <button 
                            onclick="speak('${safeKana}', this)"
                            class="absolute bottom-4 right-4 bg-blue-100 hover:bg-blue-200 text-blue-700 p-3 rounded-full transition-colors active:scale-95 shadow-sm z-10 w-12 h-12 flex items-center justify-center"
                            title="Play pronunciation"
                            aria-label="Play audio"
                        >
                            <i class="fas fa-volume-up text-xl"></i>
                        </button>
                    </div>
                `;
                phraseListContainer.innerHTML += cardHTML;
            });

            // Special tip for Introductions
            if (activeCategory === 'Introductions') {
                phraseListContainer.innerHTML += `
                    <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mt-6">
                        <h4 class="font-bold text-blue-800 mb-1 flex items-center gap-2">
                            <i class="fas fa-info-circle"></i> Swiss Tip
                        </h4>
                        <p class="text-blue-700 text-sm">
                            When Japanese people hear you are from Switzerland (Suisu), they will often smile! It is highly regarded in Japan. Remember to bow slightly when saying "Yoroshiku onegaishimasu".
                        </p>
                    </div>
                `;
            }
        }

        // --- INITIAL RENDER ---
        renderCategories();
        renderPhrases();

    </script>
</body>
</html>
