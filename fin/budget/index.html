<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiss Budget Pro v9</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles & Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { 
            font-family: 'Fira Code', monospace; 
            background-color: #020617; 
            color: #ffffff;
        }
        
        /* Custom Scrollbar for Dark Mode */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* Accents */
        .text-custom-green { color: rgb(0, 204, 51); }
        .bg-custom-green { background-color: rgb(0, 204, 51); }
        .border-custom-green { border-color: rgb(0, 204, 51); }
        
        .text-custom-pink { color: rgb(240, 118, 147); }
        .bg-custom-pink { background-color: rgb(240, 118, 147); }
        .border-custom-pink { border-color: rgb(240, 118, 147); }
        
        /* Cards */
        .card-dark { 
            background-color: #0f172a; 
            border: 1px solid #1e293b; 
            border-radius: 0.75rem;
        }
        .card-accent { 
            background-color: #0f172a; 
            border: 2px solid rgb(240, 118, 147); 
            border-radius: 0.75rem;
        }
        
        /* Buttons */
        .btn-primary {
            background-color: rgb(0, 204, 51);
            color: #020617;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background-color: rgb(0, 230, 60);
            box-shadow: 0 0 10px rgba(0, 204, 51, 0.3);
        }
        .btn-outline {
            border: 1px solid #334155;
            color: #94a3b8;
            transition: all 0.2s;
        }
        .btn-outline:hover {
            border-color: rgb(240, 118, 147);
            color: rgb(240, 118, 147);
        }
        
        /* Inputs */
        .input-dark {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: white;
            font-family: 'Fira Code', monospace;
            transition: all 0.2s;
        }
        .input-dark:focus {
            border-color: rgb(0, 204, 51);
            outline: none;
            box-shadow: 0 0 0 1px rgb(0, 204, 51);
        }
        
        /* Spinner */
        .spinner {
            border: 2px solid #334155;
            border-top: 2px solid rgb(0, 204, 51);
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .expense-row:hover { background-color: #1e293b; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { PieChart, Pie, Cell, ResponsiveContainer, Tooltip, Legend } = Recharts;

        // --- Icons ---
        const Icons = {
            Bank: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>,
            Tax: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l4-2 4 2z"/></svg>,
            Leaf: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>, 
            Fixed: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>,
            Smile: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
            Alert: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
            Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>,
            Chart: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"/></svg>,
            Refresh: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>,
            Download: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>,
            Upload: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
        };

        const formatCHF = (val) => new Intl.NumberFormat('de-CH', { style: 'currency', currency: 'CHF', maximumFractionDigits: 0 }).format(val);
        const MAX_3A_2025 = 7258;

        // --- Helper: Expense Table Component ---
        const ExpenseTable = ({ items, setItems, accentColor }) => {
            const updateItem = (id, field, value) => setItems(prev => prev.map(item => item.id === id ? { ...item, [field]: value } : item));
            const deleteItem = (id) => setItems(prev => prev.filter(item => item.id !== id));
            const addItem = () => {
                const newId = Math.max(...items.map(i => i.id), 0) + 1;
                setItems([...items, { id: newId, name: 'Neuer Eintrag', amount: 0, frequency: 'monthly' }]);
            };
            const getMonthlyVal = (item) => item.frequency === 'monthly' ? parseFloat(item.amount) : parseFloat(item.amount) / 12;

            // Resolve accent color to css class or hex for logic if needed (simplified here)
            const headerClass = accentColor === 'green' ? 'text-custom-green' : 'text-custom-pink';
            const btnHoverClass = accentColor === 'green' ? 'hover:text-[rgb(0,204,51)]' : 'hover:text-[rgb(240,118,147)]';

            return (
                <div className="w-full overflow-x-auto">
                    <table className="w-full text-sm text-left">
                        <thead className={`text-xs uppercase bg-[#1e293b] ${headerClass} font-bold`}>
                            <tr>
                                <th className="px-3 py-3 rounded-l-lg">Name</th>
                                <th className="px-3 py-3 w-32">Betrag</th>
                                <th className="px-3 py-3 w-32">Intervall</th>
                                <th className="px-3 py-3 w-10 rounded-r-lg"></th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800">
                            {items.map(item => {
                                const monthlyImpact = getMonthlyVal(item);
                                return (
                                    <tr key={item.id} className="expense-row group text-slate-300">
                                        <td className="px-2 py-2">
                                            <input type="text" value={item.name} onChange={e => updateItem(item.id, 'name', e.target.value)} className="w-full bg-transparent border-none focus:ring-0 p-1 font-medium text-slate-200 placeholder-slate-600" />
                                        </td>
                                        <td className="px-2 py-2">
                                            <div className="relative">
                                                <input type="number" value={item.amount} onChange={e => updateItem(item.id, 'amount', e.target.value)} className="w-full input-dark rounded p-1 text-right font-mono text-sm" />
                                                {item.frequency === 'yearly' && <div className="text-[10px] text-slate-500 text-right mt-1">Ø {formatCHF(monthlyImpact)}</div>}
                                            </div>
                                        </td>
                                        <td className="px-2 py-2">
                                            <select value={item.frequency} onChange={e => updateItem(item.id, 'frequency', e.target.value)} className="w-full bg-transparent text-xs text-slate-400 outline-none cursor-pointer border border-transparent hover:border-slate-700 rounded p-1">
                                                <option value="monthly" className="bg-[#0f172a]">Monatlich</option>
                                                <option value="yearly" className="bg-[#0f172a]">Jährlich</option>
                                            </select>
                                        </td>
                                        <td className="px-2 py-2 text-center">
                                            <button onClick={() => deleteItem(item.id)} className="text-slate-600 hover:text-red-500 transition-colors"><Icons.Trash /></button>
                                        </td>
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                    <button onClick={addItem} className={`mt-3 flex items-center gap-1 text-xs font-bold text-slate-400 ${btnHoverClass} px-2 py-1 rounded transition-colors uppercase tracking-wider`}>
                        <Icons.Plus /> Zeile hinzufügen
                    </button>
                </div>
            );
        };

        const BudgetApp = () => {
            const fileInputRef = useRef(null);

            // --- 1. INCOME STATE ---
            const [income, setIncome] = useState({ monthlyNet: 5666, has13th: true });
            
            // --- 2. TAX & 3a STATE ---
            const [taxState, setTaxState] = useState({ prePaid: 0, pillar3a_lump: 0, pillar3a_monthly: 550 });

            // --- API TAX STATE ---
            const [apiTax, setApiTax] = useState({ total: 0, base: 0, loading: false, error: null, fetched: false });

            // --- 3. INVESTING STATE ---
            const [investing, setInvesting] = useState(500);

            // --- 4. EXPENSES STATE ---
            const [fixedItems, setFixedItems] = useState([
                { id: 1, name: 'Miete', amount: 1690, frequency: 'monthly' },
                { id: 2, name: 'Krankenkasse', amount: 480, frequency: 'monthly' },
                { id: 3, name: 'ÖV', amount: 100, frequency: 'monthly' },
                { id: 4, name: 'Nebenkosten', amount: 60, frequency: 'monthly' },
                { id: 5, name: 'Internet', amount: 95, frequency: 'monthly' },
                { id: 7, name: 'Haftpflicht', amount: 232, frequency: 'yearly' },
                { id: 8, name: 'SERAFE', amount: 167, frequency: 'yearly' },
                { id: 10, name: 'Bankkosten', amount: 25, frequency: 'yearly' },
            ]);
            
            const [varItems, setVarItems] = useState([
                { id: 1, name: 'Abos', amount: 60, frequency: 'monthly' },
                { id: 2, name: 'Lebensmittel', amount: 550, frequency: 'monthly' },
                { id: 3, name: 'Restaurants / Lunch', amount: 200, frequency: 'monthly' },
                { id: 4, name: 'Ferien-Kasse', amount: 150, frequency: 'monthly' },
                { id: 5, name: 'Freizeit', amount: 150, frequency: 'monthly' },
                { id: 6, name: 'Haushalt', amount: 100, frequency: 'monthly' },
                { id: 7, name: 'Sonstiges', amount: 50, frequency: 'monthly' },
            ]);

            // --- EXPORT / IMPORT LOGIC ---
            const handleExport = () => {
                const data = {
                    version: 1,
                    date: new Date().toISOString(),
                    income,
                    taxState,
                    investing,
                    fixedItems,
                    varItems
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `swiss-budget-${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const handleImportClick = () => {
                fileInputRef.current?.click();
            };

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.income) setIncome(data.income);
                        if (data.taxState) setTaxState(data.taxState);
                        if (typeof data.investing !== 'undefined') setInvesting(data.investing);
                        if (data.fixedItems) setFixedItems(data.fixedItems);
                        if (data.varItems) setVarItems(data.varItems);
                        setApiTax({ total: 0, base: 0, loading: false, error: null, fetched: false });
                    } catch (err) {
                        alert('Fehler beim Laden der Datei.');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            // --- CALCULATIONS ---
            const annualNet = income.monthlyNet * (income.has13th ? 13 : 12);
            const projected3aTotal = (taxState.pillar3a_monthly * 12) + taxState.pillar3a_lump;
            const valid3aTotal = Math.min(projected3aTotal, MAX_3A_2025);
            const isMaxedOut = projected3aTotal >= MAX_3A_2025;

            // --- API LOGIC ---
            const calculateTax = async () => {
                setApiTax(prev => ({ ...prev, loading: true, error: null }));
                try {
                    const annualGross = annualNet; 
                    const commonDeductions = 150 + 500 + 2000; 
                    const taxableIncomeReal = Math.max(0, annualGross - valid3aTotal - commonDeductions);
                    const taxableIncomeBase = Math.max(0, annualGross - commonDeductions);

                    const callZhApi = async (incomeVal) => {
                        const response = await fetch("https://webcalc.services.zh.ch/ZH-Web-Calculators/calculators/INCOME_ASSETS/calculate", {
                            "headers": { "content-type": "application/json" },
                            "body": JSON.stringify({
                                "taxYear": "2026", "maritalStatus": "single", "taxScale": "BASIC", "religionP1": "OTHERS",
                                "municipality": "261", "taxableIncome": incomeVal, "taxableAssets": 0
                            }),
                            "method": "POST", "mode": "cors", "credentials": "omit"
                        });
                        if (!response.ok) throw new Error('API Error');
                        const data = await response.json();
                        if (data.totalCantonalTax && typeof data.totalCantonalTax.value !== 'undefined') {
                            return data.totalCantonalTax.value;
                        }
                        return 0; 
                    };

                    const [taxReal, taxBase] = await Promise.all([callZhApi(taxableIncomeReal), callZhApi(taxableIncomeBase)]);
                    setApiTax({ total: taxReal, base: taxBase, loading: false, error: null, fetched: true });
                } catch (err) {
                    console.error("ZH Tax API failed", err);
                    setApiTax(prev => ({ ...prev, loading: false, error: "API Blocked", fetched: true }));
                }
            };

            // Results
            const realTaxEst = apiTax.total;
            const taxSavings = Math.max(0, apiTax.base - apiTax.total);
            const monthlyTaxProvision = Math.round((realTaxEst - taxState.prePaid) / 12);
            const safeMonthlyTaxProvision = Math.max(0, monthlyTaxProvision);

            const sumMonthly = (items) => items.reduce((sum, item) => sum + (item.frequency === 'monthly' ? parseFloat(item.amount)||0 : (parseFloat(item.amount)||0)/12), 0);
            const totalFixedTable = sumMonthly(fixedItems);
            const totalVarTable = sumMonthly(varItems);
            const totalFixed = totalFixedTable + safeMonthlyTaxProvision + taxState.pillar3a_monthly;
            const totalVariable = totalVarTable;
            const totalExpenses = totalFixed + totalVariable;
            const cashflow = income.monthlyNet - totalExpenses - investing;

            // Investing Projections
            const investingYearly = investing * 12;
            const investing10Years = investingYearly * ((Math.pow(1.05, 10) - 1) / 0.05) * 1.05;

            // Charts
            const pieData = [
                { name: 'Fixkosten', value: totalFixedTable, color: '#334155' },
                { name: 'Steuern', value: safeMonthlyTaxProvision, color: 'rgb(240, 118, 147)' }, // Pink
                { name: 'Säule 3a', value: taxState.pillar3a_monthly, color: 'rgb(0, 204, 51)' }, // Green
                { name: 'Investing', value: investing, color: '#8b5cf6' }, // Violet
                { name: 'Lifestyle', value: totalVariable, color: '#3b82f6' }, // Blue
                { name: 'Cashflow', value: Math.max(0, cashflow), color: 'rgb(0, 204, 51)' }, // Green for surplus
            ];
            
            const updateIncome = (k, v) => { setIncome(p => ({...p, [k]: k === 'has13th' ? v : parseFloat(v) || 0})); setApiTax(p => ({...p, fetched: false})); };
            const updateTax = (k, v) => { setTaxState(p => ({...p, [k]: parseFloat(v) || 0})); setApiTax(p => ({...p, fetched: false})); };

            return (
                <div className="w-full px-4 md:px-6 py-6 max-w-[1600px] mx-auto">
                    <header className="mb-6 flex flex-col md:flex-row justify-between items-end gap-4 pb-4 border-b border-slate-800">
                        <div>
                            <h1 className="text-3xl font-bold text-white flex items-center gap-2">
                                Swiss Budget Pro <span className="bg-custom-green text-[#020617] px-2 py-0.5 rounded text-sm font-bold tracking-wider">v9</span>
                            </h1>
                            <p className="text-slate-400 mt-1">Advanced Financial Planning Dashboard</p>
                        </div>
                        
                        <div className="flex gap-4 items-center">
                            <div className="flex gap-2">
                                <input type="file" accept=".json" ref={fileInputRef} onChange={handleFileChange} className="hidden" />
                                <button onClick={handleImportClick} className="btn-outline px-3 py-1.5 rounded text-sm flex items-center gap-2">
                                    <Icons.Upload /> Import
                                </button>
                                <button onClick={handleExport} className="btn-outline px-3 py-1.5 rounded text-sm flex items-center gap-2">
                                    <Icons.Download /> Export
                                </button>
                            </div>
                            
                            <div className="text-right hidden lg:block border-l border-slate-700 pl-4 ml-2">
                                <span className="block text-[10px] text-slate-500 uppercase tracking-widest font-bold">Jahres-Netto (Geschätzt)</span>
                                <span className="font-mono text-xl font-bold text-custom-green">{formatCHF(annualNet)}</span>
                            </div>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 xl:grid-cols-12 gap-6">
                        <div className="xl:col-span-9 space-y-6">
                            {/* 1. INCOME & TAX */}
                            <section className="card-dark p-6 relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-1 h-full bg-custom-green"></div>
                                <h2 className="text-lg font-bold flex items-center gap-2 mb-6 text-slate-100">
                                    <span className="text-custom-green"><Icons.Bank /></span> Netto-Einkommen & Steuern
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 uppercase tracking-wide mb-2">Monatslohn (Netto Auszahlung)</label>
                                            <div className="input-group">
                                                <input type="number" value={income.monthlyNet} onChange={e => updateIncome('monthlyNet', e.target.value)} className="w-full input-dark p-3 rounded-lg text-lg font-bold font-mono" />
                                                <span className="text-slate-500">CHF</span>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-3 bg-[#1e293b] p-3 rounded-lg border border-slate-700">
                                            <input type="checkbox" checked={income.has13th} onChange={e => updateIncome('has13th', e.target.checked)} className="w-5 h-5 accent-custom-pink rounded cursor-pointer" />
                                            <div>
                                                <span className="block text-sm font-medium text-slate-200">13. Monatslohn aktivieren</span>
                                                <span className="block text-xs text-slate-500">Basis für die Steuerberechnung.</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="bg-[#1e293b] p-4 rounded-xl border border-slate-700 relative">
                                        <div className="flex justify-between items-start mb-4">
                                            <h3 className="text-xs font-bold text-slate-400 uppercase flex items-center gap-2"><Icons.Tax /> Steuer-Prognose (ZH)</h3>
                                            <button 
                                                onClick={calculateTax} 
                                                disabled={apiTax.loading}
                                                className="text-xs btn-primary px-3 py-1.5 rounded flex items-center gap-1 disabled:opacity-50 disabled:cursor-not-allowed"
                                            >
                                                {apiTax.loading ? <div className="spinner"></div> : <Icons.Refresh />} 
                                                {apiTax.loading ? 'Calculating...' : 'Berechnen'}
                                            </button>
                                        </div>
                                        
                                        {!apiTax.fetched && !apiTax.loading && (
                                            <div className="text-center py-6 text-sm text-slate-500">
                                                Drücke "Berechnen" für Live-Daten aus Zürich.
                                            </div>
                                        )}

                                        {(apiTax.fetched || apiTax.loading) && (
                                            <>
                                                <div className="space-y-2 text-sm mb-4">
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-slate-400">Geschätzte Steuer (Jahr)</span>
                                                        <span className={`font-mono text-slate-200 ${apiTax.loading ? 'opacity-50' : ''}`}>
                                                            {apiTax.error ? <span className="text-custom-pink text-xs">{apiTax.error}</span> : formatCHF(apiTax.base)}
                                                        </span>
                                                    </div>
                                                    <div className="flex justify-between items-center text-custom-green bg-green-900/20 p-1.5 rounded -mx-1.5 border border-green-900/30">
                                                        <span className="flex items-center gap-1 text-xs uppercase font-bold tracking-wide"><Icons.Leaf /> Ersparnis durch 3a</span>
                                                        <span className="font-mono font-bold">-{formatCHF(taxSavings)}</span>
                                                    </div>
                                                    <div className="flex justify-between text-slate-400">
                                                        <span>Bereits bezahlt</span>
                                                        <span className="font-mono">-{formatCHF(taxState.prePaid)}</span>
                                                    </div>
                                                </div>
                                                <div className="border-t border-slate-700 pt-3">
                                                    <div className="flex justify-between items-end mb-2">
                                                        <span className="text-sm font-bold text-slate-300">Noch zu zahlen</span>
                                                        <span className="text-xl font-bold text-white font-mono">
                                                            {apiTax.error ? '---' : formatCHF(Math.max(0, realTaxEst - taxState.prePaid))}
                                                        </span>
                                                    </div>
                                                    <div className="text-xs text-center bg-[#0f172a] border border-slate-700 rounded py-1 text-slate-400">
                                                        Sparziel: <strong className="text-custom-pink">{formatCHF(safeMonthlyTaxProvision)}</strong> / Monat
                                                    </div>
                                                </div>
                                            </>
                                        )}
                                    </div>
                                </div>
                                <div className="mt-6 pt-6 border-t border-slate-800 grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div><label className="text-xs font-bold text-slate-500 uppercase block mb-2">Bereits bezahlte Steuern</label><input type="number" value={taxState.prePaid} onChange={e => updateTax('prePaid', e.target.value)} className="w-full input-dark p-2 rounded text-sm font-mono" /></div>
                                    <div><label className="text-xs font-bold text-slate-500 uppercase block mb-2">3a Einmalzahlungen</label><input type="number" value={taxState.pillar3a_lump} onChange={e => updateTax('pillar3a_lump', e.target.value)} className="w-full input-dark p-2 rounded text-sm font-mono" /></div>
                                    <div className={isMaxedOut ? "opacity-50" : ""}><label className="text-xs font-bold text-slate-500 uppercase block mb-2">Monatlicher 3a Sparplan</label><input type="number" value={taxState.pillar3a_monthly} onChange={e => updateTax('pillar3a_monthly', e.target.value)} className="w-full bg-[#1e293b] border border-green-900/50 text-custom-green p-2 rounded text-sm font-mono font-bold focus:outline-none focus:border-custom-green" /></div>
                                </div>
                            </section>

                            {/* 2. EXPENSES */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <section className="card-dark p-6 flex flex-col h-full relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-1 h-full bg-slate-600"></div>
                                    <h2 className="text-md font-bold mb-4 flex items-center gap-2 text-slate-200"><Icons.Fixed /> Fixkosten (Monat)</h2>
                                    <div className="mb-4 space-y-1 bg-[#1e293b] p-3 rounded-lg border border-slate-700">
                                        <div className="flex justify-between text-sm"><span className="font-bold text-custom-pink">Steuerrückstellung</span><span className="font-mono font-bold text-custom-pink">{formatCHF(safeMonthlyTaxProvision)}</span></div>
                                        <div className="flex justify-between text-sm"><span className="font-bold text-custom-green">Säule 3a Sparplan</span><span className="font-mono font-bold text-custom-green">{formatCHF(taxState.pillar3a_monthly)}</span></div>
                                    </div>
                                    <ExpenseTable items={fixedItems} setItems={setFixedItems} accentColor="pink" />
                                    <div className="mt-auto pt-4 border-t border-slate-800 flex justify-between font-bold text-slate-400"><span>Total Fix (inkl. Steuer/3a)</span><span>{formatCHF(totalFixed)}</span></div>
                                </section>
                                <section className="card-dark p-6 flex flex-col h-full relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                                    <h2 className="text-md font-bold mb-4 flex items-center gap-2 text-slate-200"><Icons.Smile /> Lifestyle & Variabel</h2>
                                    <ExpenseTable items={varItems} setItems={setVarItems} accentColor="green" />
                                    <div className="mt-auto pt-4 border-t border-slate-800 flex justify-between font-bold text-blue-400"><span>Total Variabel</span><span>{formatCHF(totalVariable)}</span></div>
                                </section>
                            </div>

                            {/* 3. INVESTING */}
                            <section className="card-dark p-6 relative overflow-hidden border-violet-900/30">
                                <div className="absolute top-0 left-0 w-1 h-full bg-violet-500"></div>
                                <h2 className="text-md font-bold mb-4 flex items-center gap-2 text-violet-400"><Icons.Chart /> Investing & Vermögensaufbau</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8 items-center">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wide mb-2">Monatlicher Invest-Betrag</label>
                                        <div className="input-group">
                                            <input type="number" value={investing} onChange={e => setInvesting(parseFloat(e.target.value)||0)} className="w-full input-dark p-3 rounded text-lg font-bold text-violet-400 focus:border-violet-500" />
                                            <span className="text-slate-500">CHF</span>
                                        </div>
                                    </div>
                                    <div className="md:col-span-2 grid grid-cols-2 gap-4">
                                        <div className="bg-[#1e293b] p-4 rounded border border-slate-700"><span className="block text-[10px] uppercase text-slate-500 font-bold tracking-wider">Investiert pro Jahr</span><span className="block text-xl font-mono text-violet-400 font-bold mt-1">{formatCHF(investingYearly)}</span></div>
                                        <div className="bg-[#1e293b] p-4 rounded border border-slate-700"><span className="block text-[10px] uppercase text-slate-500 font-bold tracking-wider">In 10 Jahren (ca. 5%)</span><span className="block text-xl font-mono text-violet-400 font-bold mt-1">{formatCHF(investing10Years)}</span></div>
                                    </div>
                                </div>
                            </section>
                        </div>

                        {/* SUMMARY */}
                        <div className="xl:col-span-3 space-y-6">
                            <div className="card-accent p-6 sticky top-6 shadow-[0_0_15px_rgba(240,118,147,0.15)]">
                                <h3 className="text-xs font-bold text-custom-pink uppercase tracking-[0.2em] mb-6 text-center">Cashflow Analysis</h3>
                                <div className="space-y-4 mb-8 text-sm">
                                    <div className="flex justify-between items-center text-base font-bold"><span>Netto Lohn</span><span className="font-mono text-custom-green">{formatCHF(income.monthlyNet)}</span></div>
                                    <div className="w-full bg-slate-800 h-px my-2"></div>
                                    <div className="flex justify-between items-center text-slate-400"><span>- Fixkosten & 3a</span><span className="font-mono text-slate-200">-{formatCHF(totalFixed)}</span></div>
                                    <div className="flex justify-between items-center text-slate-400"><span>- Variabel</span><span className="font-mono text-blue-300">-{formatCHF(totalVariable)}</span></div>
                                    <div className="flex justify-between items-center text-violet-300 font-medium"><span>- Investing</span><span className="font-mono">-{formatCHF(investing)}</span></div>
                                    <div className="w-full bg-slate-800 h-px my-2"></div>
                                </div>
                                <div className="text-center">
                                    <span className="text-xs text-slate-500 uppercase tracking-widest font-bold">Free Cashflow</span>
                                    <div className={`text-5xl font-bold mt-3 tracking-tight ${cashflow >= 0 ? 'text-custom-green' : 'text-custom-pink'}`}>{formatCHF(cashflow)}</div>
                                    <div className="mt-4 text-xs text-slate-500">{income.has13th && <span className="text-custom-green bg-green-900/10 px-2 py-1 rounded inline-flex items-center justify-center gap-1 mt-2 border border-green-900/30 font-bold"><Icons.Leaf /> + 13. Lohn Ende Jahr!</span>}</div>
                                </div>
                                <div className="h-48 w-full mt-8">
                                    <ResponsiveContainer>
                                        <PieChart>
                                            <Pie data={pieData} cx="50%" cy="50%" innerRadius={40} outerRadius={70} paddingAngle={4} dataKey="value" stroke="none">
                                                {pieData.map((entry, index) => (<Cell key={`cell-${index}`} fill={entry.color} />))}
                                            </Pie>
                                            <Tooltip formatter={(val) => formatCHF(val)} contentStyle={{backgroundColor: '#0f172a', border: '1px solid #334155', borderRadius: '8px', color: '#fff'}} itemStyle={{color: '#fff'}} />
                                            <Legend iconSize={8} wrapperStyle={{fontSize: '10px', color: '#94a3b8'}} />
                                        </PieChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BudgetApp />);
    </script>
</body>
</html>
